name: Publish Image to Docker Hub

on:
  workflow_call:
    inputs:
      version:
        description: 'Nextcloud image version to publish (for example: 35.0.2-fpm)'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      version:
        description: 'Existing GHCR image version to publish (for example: 35.0.2-fpm)'
        required: true
        type: string

permissions:
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy image to Docker Hub
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create \
            --tag tablebird/nextcloud:${VERSION} \
            ghcr.io/tablebird/nextcloud:${VERSION}