name: Auto Build Nextcloud Image

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nextcloud

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Latest Nextcloud FPM Version
        id: version
        run: |
          TAG=$(curl -s https://hub.docker.com/v2/repositories/library/nextcloud/tags?page_size=100 | \
            jq -r '.results[].name' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+-fpm$' | \
            sort -V | \
            tail -n 1)

          echo "LATEST_VERSION=$TAG" >> $GITHUB_OUTPUT

          echo "Detected version: $TAG"

      - name: Read Last Built Version
        id: last
        run: |
          if [ -f .last_version ]; then
            VERSION=$(cat .last_version)
          else
            VERSION="none"
          fi

          echo "LAST_VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "Last version: $VERSION"

      - name: Compare Versions
        id: compare
        run: |
          if [ "${{ steps.version.outputs.LATEST_VERSION }}" != "${{ steps.last.outputs.LAST_VERSION }}" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if No New Version
        if: steps.compare.outputs.BUILD == 'false'
        run: |
          echo "No new version detected"
          exit 0

      - name: Set up QEMU
        if: steps.compare.outputs.BUILD == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.compare.outputs.BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.compare.outputs.BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: steps.compare.outputs.BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.version.outputs.LATEST_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.LATEST_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: |
            linux/amd64
            linux/arm64

      - name: Save Current Version
        if: steps.compare.outputs.BUILD == 'true'
        run: |
          echo "${{ steps.version.outputs.LATEST_VERSION }}" > .last_version

      - name: Commit Version File
        if: steps.compare.outputs.BUILD == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .last_version
          git commit -m "Update built version: ${{ steps.version.outputs.LATEST_VERSION }}"
          git push