name: Auto Build Nextcloud Image

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      version:
        description: 'Manual Nextcloud FPM version to build (for example: 31.0.6-fpm). Leave empty to use the scheduled auto-build flow.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nextcloud

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version to Build
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            BUILD_MODE="manual"
          else
            VERSION=$(curl -s https://hub.docker.com/v2/repositories/library/nextcloud/tags?page_size=100 | \
              jq -r '.results[].name' | \
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+-fpm$' | \
              sort -V | \
              tail -n 1)
            BUILD_MODE="auto"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_MODE=$BUILD_MODE" >> $GITHUB_OUTPUT

          echo "Resolved version: $VERSION"

      - name: Read Last Built Version
        if: steps.resolve.outputs.BUILD_MODE == 'auto'
        id: last
        run: |
          if [ -f .last_version ]; then
            VERSION=$(cat .last_version)
          else
            VERSION="none"
          fi

          echo "LAST_VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "Last version: $VERSION"

      - name: Compare Versions
        if: steps.resolve.outputs.BUILD_MODE == 'auto'
        id: compare
        run: |
          if [ "${{ steps.resolve.outputs.VERSION }}" != "${{ steps.last.outputs.LAST_VERSION }}" ]; then
            echo "BUILD=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if No New Version
        if: steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'false'
        run: |
          echo "No new version detected"
          exit 0

      - name: Set up QEMU
        if: steps.resolve.outputs.BUILD_MODE == 'manual' || (steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'true')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.BUILD_MODE == 'manual' || (steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'true')
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.resolve.outputs.BUILD_MODE == 'manual' || (steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: steps.resolve.outputs.BUILD_MODE == 'manual' || (steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.resolve.outputs.VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.VERSION }}
          platforms: |
            linux/amd64
            linux/arm64

      - name: Save Current Version
        if: steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'true'
        run: |
          echo "${{ steps.resolve.outputs.VERSION }}" > .last_version

      - name: Commit Version File
        if: steps.resolve.outputs.BUILD_MODE == 'auto' && steps.compare.outputs.BUILD == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .last_version
          git commit -m "Update built version: ${{ steps.resolve.outputs.VERSION }}"
          git push